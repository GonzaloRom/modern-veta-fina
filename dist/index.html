    <style>
      /* Configuración de fuente base */
      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      }
      
      /* Loading screen básico */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #FEF3E2 0%, #FED7AA 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-text {
        color: #92400E;
        font-size: 1.5rem;
        font-weight: 700;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CDgrKtOI.js"></script>

  <body>
    <!-- Loading screen inicial -->
    <div id="loading" class="loading">
      <div class="loading-text">VETA FINA</div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Remover loading screen cuando la app esté lista
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
              loading.remove();
            }, 500);
          }
        }, 1000);
      });
    </script>
  </body>
